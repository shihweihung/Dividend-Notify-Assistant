<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>息引力 - 您的台股股息管家</title>
    <meta name="description" content="全方位台股除息領息行事曆、個人資產成長與股息管理工具" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="息引力" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      /* Instant Splash Screen Styles - zero dependency, works before any CSS/JS loads */
      @media (prefers-color-scheme: dark) {
        body { background-color: #0f172a; color: #f8fafc; }
        .splash-card { background-color: #1e293b; border-color: #334155; }
        .splash-sub { color: #94a3b8; }
        .splash-tip { color: #64748b; }
      }
      @media (prefers-color-scheme: light) {
        body { background-color: #f8fafc; color: #0f172a; }
        .splash-card { background-color: #ffffff; border-color: #e2e8f0; }
        .splash-sub { color: #64748b; }
        .splash-tip { color: #94a3b8; }
      }
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        min-height: 100dvh;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        padding-left: calc(24px + env(safe-area-inset-left, 0px));
        padding-right: calc(24px + env(safe-area-inset-right, 0px));
        z-index: 9999;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 28px;
        border-radius: 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border-width: 1px;
        border-style: solid;
        max-width: 320px;
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
      }
      .splash-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.025em;
        margin: 0 0 4px 0;
      }
      .splash-sub {
        font-size: 13px;
        margin: 0 0 24px 0;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .splash-tip {
        font-size: 11px;
        line-height: 1.5;
        margin-top: 12px;
      }
      .reload-btn {
        display: none;
        margin-top: 12px;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        background-color: #6366f1;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant preloader to prevent blank screen while mobile device fetches & parses JS -->
      <div id="initial-loader">
        <div class="splash-card">
          <div class="splash-logo">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <h1 class="splash-title">息引力</h1>
          <p class="splash-sub">您的台股股息管家</p>
          <div class="splash-spinner"></div>
          <div class="splash-tip" id="loading-msg">正在安全載入持股與除息行事曆...</div>
          <button class="reload-btn" id="reload-btn" onclick="window.location.reload()">重新整理頁面</button>
        </div>
      </div>
      <script>
        // Show reload button if initial page load hangs (e.g., Cloud Run cold start or weak cellular signal)
        setTimeout(function() {
          var msg = document.getElementById('loading-msg');
          var btn = document.getElementById('reload-btn');
          if (msg && btn) {
            msg.textContent = '雲端伺服器正在喚醒中，若超過 10 秒未進入，可點擊重新整理：';
            btn.style.display = 'inline-block';
          }
        }, 7000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
