name: Claude Review on Push

on:
  push:
    branches: [main]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # 貼 commit comment 需要
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2   # 要有前一個 commit 才能 diff

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint 2>&1 | tee lint.log || true

      - name: Test
        run: npm test 2>&1 | tee test.log || true

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            審查本次 commit。步驟:
            1. 用 `git diff HEAD~1 HEAD` 取得本次變更
            2. 讀 lint.log 與 test.log,確認有沒有失敗
            3. 依 CLAUDE.md 列出的專案慣例檢查這份 diff

            重點:會靜默丟資料或算錯數字的 bug、前後端重複實作、
            與既有邏輯衝突之處、測試是否涵蓋這次改動。

            沒問題就直接說沒問題,不要湊字數。
            有問題時指出檔案與行號,並說明會在什麼情況下出錯。

            用繁體中文,結果寫進 review.md,300 字以內。
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Read,Grep,Glob,Write"

      - name: Post review as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f review.md ] || { echo "no review.md, skipping"; exit 0; }
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat review.md)"
